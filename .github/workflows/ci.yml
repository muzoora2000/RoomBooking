name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_test?sslmode=disable
      PGSSL: disable
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret
      OTP_PEPPER: ci-only-otp-pepper
      QR_SIGNING_SECRET: ci-only-qr-secret
      DOOR_TOKEN_SECRET: ci-only-door-secret
      CRON_SECRET: ci-only-cron-secret
      FRONTEND_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install API dependencies
        working-directory: backend
        run: npm ci
      - name: Apply schema
        working-directory: backend
        run: npm run migrate
      - name: Seed demo data
        working-directory: backend
        run: npm run seed
      - name: Run unit and integration tests
        working-directory: backend
        run: npm test
      - name: Check backend syntax
        working-directory: backend
        run: |
          for file in $(find src tests -name '*.js'); do node --check "$file"; done
      - name: Check frontend ESM syntax
        run: |
          shopt -s globstar
          mkdir -p /tmp/frontend-check
          for file in frontend/js/**/*.js frontend/sw.js; do
            name=$(echo "$file" | tr '/' '_')
            cp "$file" "/tmp/frontend-check/${name%.js}.mjs"
            node --check "/tmp/frontend-check/${name%.js}.mjs"
          done
