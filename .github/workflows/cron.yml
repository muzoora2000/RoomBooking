name: Operations cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: campus-operations-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.RENDER_API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate configuration
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set repository secrets RENDER_API_URL (for example https://campus-api.onrender.com) and CRON_SECRET." >&2
            exit 1
          fi
      - name: Send reminders
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$API_BASE_URL/api/internal/reminders" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
      - name: Release no-show rooms
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$API_BASE_URL/api/internal/release-no-shows" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
      - name: Process notification queue
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$API_BASE_URL/api/internal/process-queue" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"limit":50}'
