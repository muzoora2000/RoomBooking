<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6b57">
  <title>Administration | Campus Compass</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
</head>
<body data-page="admin">
  <header id="topbar"></header>
  <main class="page admin-page">
    <div class="page-head">
      <div>
        <div class="eyebrow">Administration</div>
        <h1>Operations console</h1>
        <p class="muted" id="admin-subtitle">Loading your department scope...</p>
      </div>
      <a class="btn ghost" href="index.html">Back to app</a>
    </div>

    <div class="tabs admin-tabs" role="tablist" id="admin-tabs">
      <button type="button" class="tab active" data-admin-tab="overview" aria-selected="true">Overview</button>
      <button type="button" class="tab" data-admin-tab="bookings" aria-selected="false">Bookings</button>
      <button type="button" class="tab" data-admin-tab="facilities" aria-selected="false">Rooms</button>
      <button type="button" class="tab" data-admin-tab="users" aria-selected="false">Users</button>
      <button type="button" class="tab" data-admin-tab="issues" aria-selected="false">Issues</button>
      <button type="button" class="tab" data-admin-tab="study" aria-selected="false">Study mode</button>
      <button type="button" class="tab" data-admin-tab="data" aria-selected="false">Data requests</button>
      <button type="button" class="tab" data-admin-tab="audit" aria-selected="false">Audit</button>
      <button type="button" class="tab hidden" data-admin-tab="settings" aria-selected="false" id="settings-tab">Settings</button>
    </div>

    <section id="admin-content">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>
  </main>
  <nav id="bottom-nav"></nav>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/admin.js"></script>
</body>
</html>
