<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6b57">
  <meta name="campus-api-base" content="">
  <title>Courses &amp; Faculties | Campus Compass</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
</head>
<body data-page="courses">
  <header id="topbar"></header>
  <main class="page">
    <div class="page-head">
      <div>
        <div class="eyebrow">Cavendish University Uganda</div>
        <h1>Faculties &amp; Courses</h1>
        <p class="muted">Browse all faculties, programmes, and courses offered at Cavendish University.</p>
      </div>
    </div>

    <!-- Faculty filter tabs -->
    <div id="faculty-tabs" class="chip-bar" style="margin-bottom:1.2rem;display:flex;flex-wrap:wrap;gap:.5rem">
      <button class="chip active" data-dept-id="" type="button">All Faculties</button>
    </div>

    <!-- Search bar -->
    <form id="course-search-form" style="margin-bottom:1rem;display:flex;gap:.5rem">
      <input type="search" id="course-search" placeholder="Search courses or programmes…" style="flex:1;padding:.55rem .8rem;border:1px solid var(--border);border-radius:8px;font-size:.95rem">
      <button class="btn secondary" type="submit">Search</button>
    </form>

    <div id="course-count" class="muted small" style="margin-bottom:.8rem">Loading…</div>

    <!-- Results -->
    <div id="faculty-list"></div>
  </main>
  <nav id="bottom-nav"></nav>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/courses.js"></script>
</body>
</html>
