<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6b57">
  <title>My lectures | Campus Compass</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
</head>
<body data-page="lectures">
  <header id="topbar"></header>
  <main class="page narrow">
    <div class="page-head">
      <div>
        <div class="eyebrow">Teaching schedule</div>
        <h1>My lectures</h1>
        <p class="muted">See where each session is, join online classes, and check your class roster.</p>
      </div>
      <a class="btn ghost" href="bookings.html">My bookings</a>
    </div>

    <div class="filters">
      <input type="search" id="lecture-search" placeholder="Search module, room, or lecturer" aria-label="Search lectures">
      <select id="lecture-mode" aria-label="Filter by mode">
        <option value="">All modes</option>
        <option value="physical">In person</option>
        <option value="online">Online</option>
        <option value="hybrid">Hybrid</option>
      </select>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-lecture-tab="upcoming" aria-selected="true">Upcoming</button>
      <button type="button" class="tab" data-lecture-tab="past" aria-selected="false">Recent</button>
    </div>

    <div id="semester-label" class="small muted" style="margin-bottom:.8rem"></div>
    <div id="lectures-list"></div>
  </main>
  <nav id="bottom-nav"></nav>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/lectures.js"></script>
</body>
</html>
