<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6b57">
  <title>Notifications | Campus Compass</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
</head>
<body data-page="notifications">
  <header id="topbar"></header>
  <main class="page narrow">
    <div class="page-head">
      <div>
        <div class="eyebrow">Updates</div>
        <h1>Notifications</h1>
        <p class="muted">Booking changes, check-in reminders, and important campus alerts.</p>
      </div>
      <button class="btn ghost" type="button" id="mark-all">Mark all read</button>
    </div>

    <section class="card" id="push-card">
      <div class="row space-between">
        <div>
          <h3>Push notifications</h3>
          <p class="muted small" id="push-status">Checking this device...</p>
        </div>
        <button class="btn secondary small" type="button" id="push-toggle" disabled>Enable</button>
      </div>
      <p class="small muted" id="push-message" style="margin-top:.5rem"></p>
    </section>

    <div class="tabs" role="tablist" style="margin-top:1rem">
      <button type="button" class="tab active" data-notification-tab="all" aria-selected="true">All</button>
      <button type="button" class="tab" data-notification-tab="unread" aria-selected="false">Unread</button>
    </div>

    <div id="notifications-list"></div>
    <button class="btn secondary wide hidden" type="button" id="load-more">Load more</button>
  </main>
  <nav id="bottom-nav"></nav>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/notifications.js"></script>
</body>
</html>
