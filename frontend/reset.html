<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6b57">
  <meta name="campus-api-base" content="">
  <title>Reset password | Campus Compass</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js"></script>
</head>
<body data-page="reset" data-no-chrome>
  <main class="auth-wrap">
    <div class="auth-card">
      <a class="brand auth-logo" href="index.html">
        <img src="icons/cavendish-logo.jpg" alt="Cavendish University Uganda" class="auth-logo-img">
      </a>
      <section class="card">
        <div id="forgot-panel">
          <div class="eyebrow">Account recovery</div>
          <h1 style="font-size:1.8rem">Reset your password</h1>
          <p class="muted">Enter the email address on your campus account. If it matches, a reset link will be emailed to you.</p>
          <form id="forgot-form" novalidate>
            <div class="field">
              <label for="forgot-email">Email address</label>
              <input id="forgot-email" name="email" type="email" autocomplete="email" required>
            </div>
            <p class="error-text hidden" id="forgot-error" role="alert"></p>
            <p class="notice success hidden" id="forgot-success"></p>
            <button class="btn wide" type="submit" id="forgot-submit">Email me a reset link</button>
          </form>
        </div>
        <div id="reset-panel" class="hidden">
          <div class="eyebrow">Choose a new password</div>
          <h1 style="font-size:1.8rem">Set a new password</h1>
          <form id="reset-form" novalidate>
            <div class="field">
              <label for="reset-password">New password</label>
              <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
              <p class="hint">At least 8 characters, including a letter and a number.</p>
            </div>
            <div class="field">
              <label for="reset-confirm">Confirm password</label>
              <input id="reset-confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <p class="error-text hidden" id="reset-error" role="alert"></p>
            <p class="notice success hidden" id="reset-success"></p>
            <button class="btn wide" type="submit" id="reset-submit">Update password</button>
          </form>
        </div>
        <p class="center small" style="margin-top:.9rem"><a href="login.html">Back to sign in</a></p>
      </section>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pages/reset.js"></script>
</body>
</html>
